<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="60%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#1e0a3c"/>
    </radialGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- faint diagonal hairlines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <line x1="-40" y1="420" x2="380" y2="0"/>
    <line x1="20" y1="420" x2="440" y2="0"/>
    <line x1="80" y1="420" x2="500" y2="0"/>
  </g>

  <!-- decorative sparkle + plus, top-left -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round">
    <path d="M 100 95 v 22 M 89 106 h 22"/>
    <path d="M 100 88 v 6 M 100 116 v 6 M 93 106 h -6 M 113 106 h 6" opacity="0.5"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round">
    <path d="M 160 300 v 14 M 153 307 h 14"/>
  </g>

  <!-- headline -->
  <text x="80" y="200" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="800" fill="#ffffff">Stepped away</text>
  <text x="80" y="253" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="800" fill="#d8b4fe">for a while?</text>
  <text x="80" y="292" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#e9d5ff" fill-opacity="0.85">Unlock to pick up right where you left off.</text>

  <!-- icon side -->
  <g transform="translate(1020, 210)">
    <circle r="118" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>
    <circle r="92" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
    <path d="M -92 -35 A 92 92 0 0 1 -35 -92" fill="none" stroke="#d8b4fe" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>

    <circle cx="111" cy="-57" r="4" fill="#d8b4fe" fill-opacity="0.9"/>
    <circle cx="-122" cy="58" r="3.5" fill="#c084fc" fill-opacity="0.7"/>
    <circle cx="120" cy="88" r="3" fill="#d8b4fe" fill-opacity="0.8"/>

    <rect x="-63" y="-63" width="126" height="126" rx="28" fill="#ffffff" fill-opacity="0.1"/>
    <g transform="translate(-24, -30)">
      <path d="M 8 28 v -9 a 16 16 0 0 1 32 0 v 9" fill="none" stroke="#1a0b2e" stroke-width="6.5" stroke-linecap="round"/>
      <rect x="0" y="28" width="48" height="38" rx="9" fill="url(#badge)"/>
      <circle cx="24" cy="44" r="5.5" fill="#1a0b2e"/>
      <rect x="21.5" y="44" width="5" height="12" rx="2.5" fill="#1a0b2e"/>
    </g>
  </g>
</svg>
