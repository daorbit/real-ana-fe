<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="fsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Inner Glow / Specular -->
    <linearGradient id="fsGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for glyph -->
    <filter id="fsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#1e1b4b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="24" cy="24" r="22" fill="url(#fsBg)"/>
  <circle cx="24" cy="24" r="21.5" stroke="url(#fsGlow)" stroke-width="1"/>

  <!-- Submissions Glyph: Sleek stylized form sheet + send badge -->
  <g filter="url(#fsShadow)">
    <!-- Form Card -->
    <rect x="13" y="11" width="18" height="23" rx="3.5" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Form lines -->
    <rect x="16.5" y="15.5" width="8" height="2" rx="1" fill="#6366f1" fill-opacity="0.8"/>
    <rect x="16.5" y="19.5" width="11" height="2" rx="1" fill="#94a3b8"/>
    <rect x="16.5" y="23.5" width="9" height="2" rx="1" fill="#cbd5e1"/>

    <!-- Floating check pill / paper plane badge -->
    <circle cx="29" cy="28" r="7.5" fill="#10b981"/>
    <circle cx="29" cy="28" r="7" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Checkmark -->
    <path d="M26.5 28.2L28.2 29.9L32 26" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

